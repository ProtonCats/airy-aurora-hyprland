# Decoration Settings — Airy Aurora

# Hyprland Wiki Links
# Animation - https://wiki.hyprland.org/Configuring/Animations/
# Decoration - https://wiki.hyprland.org/Configuring/Variables/#decoration

# Sourcing colors generated by wallust (fixed palette: ~/.config/wallust/colorschemes/airy-aurora.json)
source = $HOME/.config/hypr/wallust/wallust-hyprland.conf

general {
  border_size = 2
  gaps_in = 5
  gaps_out = 10

  col.active_border = rgba(AACCDDee) rgba(9CB9C9ee) rgba(CCB2B9ee) 45deg
  col.inactive_border = rgba(DDE6EE66)
}

decoration {
  rounding = 12

  active_opacity = 1.0
  inactive_opacity = 0.94
  fullscreen_opacity = 1.0

  dim_inactive = false
  dim_special = 0.3

  shadow {
    enabled = true
    range = 18
    render_power = 3
    color = rgba(30343D22)
    color_inactive = rgba(30343D11)
  }

  blur {
    enabled = true
    size = 8
    passes = 3
    new_optimizations = true
    xray = true
    ignore_opacity = true
    special = true
    popups = true
    vibrancy = 0.18
    brightness = 1.05
  }
}

group {
  col.border_active = rgba(AACCDDee) rgba(CCB2B9ee) 45deg
  col.border_inactive = rgba(DDE6EE66)

  groupbar {
    col.active = $color12
    col.inactive = $color10
    text_color = $background
  }
}
